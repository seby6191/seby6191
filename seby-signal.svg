<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="120"
     viewBox="0 0 1000 120">

  <defs>

    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect x="1"
        y="1"
        width="998"
        height="118"
        rx="24"
        fill="#020617"
        stroke="#1e293b"/>

  <circle cx="65"
          cy="60"
          r="5"
          fill="#22d3ee"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

  <text x="90"
        y="65"
        fill="#64748b"
        font-family="monospace"
        font-size="13"
        letter-spacing="3">
    SEBY6191
  </text>

  <line x1="260"
        y1="60"
        x2="740"
        y2="60"
        stroke="#172033"
        stroke-width="2"/>

  <circle r="5"
          fill="#ffffff"
          filter="url(#glow)">

    <animateMotion
      path="M260 60 L740 60"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

  <text x="790"
        y="65"
        fill="#cbd5e1"
        font-family="monospace"
        font-size="13"
        letter-spacing="3">
    EVOLVING
  </text>

  <circle cx="930"
          cy="60"
          r="20"
          fill="none"
          stroke="url(#signal)"
          stroke-width="2"
          stroke-dasharray="12 8">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 930 60"
      to="360 930 60"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>

  <circle cx="930"
          cy="60"
          r="4"
          fill="#ffffff"
          filter="url(#glow)">

    <animate attributeName="r"
             values="3;6;3"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

</svg>
