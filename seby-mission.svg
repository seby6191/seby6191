
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="190"
     viewBox="0 0 1100 190">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panel">
      <rect x="1" y="1" width="1098" height="188" rx="24"/>
    </clipPath>

  </defs>



  <rect x="1"
        y="1"
        width="1098"
        height="188"
        rx="24"
        fill="url(#bg)"
        stroke="#1e293b"
        stroke-width="1.5"/>



  <g clip-path="url(#panel)">

    <rect x="-220"
          y="0"
          width="140"
          height="190"
          fill="#22d3ee"
          opacity=".04"
          transform="skewX(-18)">

      <animate
        attributeName="x"
        values="-220;1300"
        dur="5s"
        repeatCount="indefinite"/>

    </rect>

    <line x1="0"
          y1="42"
          x2="1100"
          y2="42"
          stroke="#22d3ee"
          stroke-opacity=".12"
          stroke-dasharray="4 16">

      <animate
        attributeName="stroke-dashoffset"
        values="0;-100"
        dur="3s"
        repeatCount="indefinite"/>

    </line>

  </g>



  <circle cx="70"
          cy="50"
          r="5"
          fill="#22d3ee"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.6s"
      repeatCount="indefinite"/>

  </circle>

  <text x="92"
        y="56"
        fill="#64748b"
        font-family="monospace"
        font-size="12"
        letter-spacing="4">
    ENGINEERING DIRECTIVE
  </text>



  <text x="550"
        y="95"
        text-anchor="middle"
        fill="url(#neon)"
        filter="url(#glow)"
        font-family="monospace"
        font-size="24"
        font-weight="700"
        letter-spacing="3">

    I BUILD SYSTEMS TO UNDERSTAND THEM.

    <animate
      attributeName="opacity"
      values=".75;1;.75"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <g font-family="monospace"
     font-size="12"
     fill="#94a3b8"
     text-anchor="middle">

    <text x="250" y="145">C#</text>
    <text x="350" y="145">.NET</text>
    <text x="470" y="145">ASP.NET</text>
    <text x="610" y="145">SQL</text>
    <text x="730" y="145">REACT</text>
    <text x="850" y="145">TYPESCRIPT</text>

  </g>



  <line x1="220"
        y1="160"
        x2="880"
        y2="160"
        stroke="#172033"
        stroke-width="2"/>



  <circle r="5"
          fill="#ffffff"
          filter="url(#glow)">

    <animateMotion
      path="M220 160 L880 160"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>

  <circle r="15"
          fill="#22d3ee"
          opacity=".18"
          filter="url(#glow)">

    <animateMotion
      path="M220 160 L880 160"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>



  <path d="M28 42 V24 H46"
        fill="none"
        stroke="#22d3ee"
        stroke-opacity=".55"/>

  <path d="M1054 24 H1072 V42"
        fill="none"
        stroke="#a78bfa"
        stroke-opacity=".55"/>

  <path d="M28 148 V166 H46"
        fill="none"
        stroke="#a78bfa"
        stroke-opacity=".35"/>

  <path d="M1054 166 H1072 V148"
        fill="none"
        stroke="#22d3ee"
        stroke-opacity=".35"/>

</svg>

