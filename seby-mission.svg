
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="360"
     viewBox="0 0 1100 360">

  <defs>

    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="titleGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

  </defs>



  <rect width="1100"
        height="360"
        rx="28"
        fill="url(#bgGlow)"/>

  <!-- AMBIENT GLOW -->

  <circle cx="550"
          cy="178"
          r="125"
          fill="#22d3ee"
          opacity=".035"
          filter="url(#bigGlow)">

    <animate attributeName="r"
             values="110;145;110"
             dur="5s"
             repeatCount="indefinite"/>

  </circle>



  <ellipse cx="550"
           cy="178"
           rx="430"
           ry="115"
           fill="none"
           stroke="#22d3ee"
           stroke-opacity=".13"
           stroke-width="1.5"
           stroke-dasharray="4 14">

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 550 178"
                      to="360 550 178"
                      dur="40s"
                      repeatCount="indefinite"/>

  </ellipse>



  <ellipse cx="550"
           cy="178"
           rx="300"
           ry="78"
           fill="none"
           stroke="#a78bfa"
           stroke-opacity=".16"
           stroke-width="1.5"
           stroke-dasharray="2 11">

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="360 550 178"
                      to="0 550 178"
                      dur="28s"
                      repeatCount="indefinite"/>

  </ellipse>


  <circle cx="550"
          cy="178"
          r="72"
          fill="#07111f"
          stroke="#22d3ee"
          stroke-opacity=".3"/>

  <circle cx="550"
          cy="178"
          r="54"
          fill="none"
          stroke="#a78bfa"
          stroke-opacity=".5"
          stroke-width="2"
          stroke-dasharray="8 9">

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 550 178"
                      to="360 550 178"
                      dur="10s"
                      repeatCount="indefinite"/>

  </circle>

  <circle cx="550"
          cy="178"
          r="14"
          fill="#ffffff"
          filter="url(#softGlow)">

    <animate attributeName="r"
             values="10;17;10"
             dur="2.4s"
             repeatCount="indefinite"/>

  </circle>



  <text x="550"
        y="74"
        text-anchor="middle"
        fill="#64748b"
        font-family="monospace"
        font-size="12"
        letter-spacing="5">
    ENGINEERING PHILOSOPHY
  </text>

  <text x="550"
        y="116"
        text-anchor="middle"
        fill="url(#titleGradient)"
        font-family="monospace"
        font-size="24"
        font-weight="700"
        letter-spacing="3"
        filter="url(#softGlow)">
    I BUILD SYSTEMS
  </text>

  <text x="550"
        y="145"
        text-anchor="middle"
        fill="#cbd5e1"
        font-family="monospace"
        font-size="17"
        letter-spacing="4">
    TO UNDERSTAND THEM
  </text>





  <g transform="translate(120 177)">
    <circle r="28"
            fill="#07111f"
            stroke="#22d3ee"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#22d3ee"
            filter="url(#softGlow)">

      <animate attributeName="opacity"
               values=".25;1;.25"
               dur="2s"
               repeatCount="indefinite"/>

    </circle>

    <text y="47"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="12">
      C#
    </text>
  </g>



  <g transform="translate(280 96)">
    <circle r="24"
            fill="#07111f"
            stroke="#38bdf8"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#38bdf8"
            filter="url(#softGlow)"/>

    <text y="-36"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="12">
      .NET
    </text>
  </g>



  <g transform="translate(390 275)">
    <circle r="24"
            fill="#07111f"
            stroke="#60a5fa"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#60a5fa"
            filter="url(#softGlow)"/>

    <text y="44"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="11">
      ASP.NET
    </text>
  </g>



  <g transform="translate(710 272)">
    <circle r="24"
            fill="#07111f"
            stroke="#818cf8"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#818cf8"
            filter="url(#softGlow)"/>

    <text y="44"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="12">
      SQL
    </text>
  </g>


  <g transform="translate(820 96)">
    <circle r="24"
            fill="#07111f"
            stroke="#a78bfa"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#a78bfa"
            filter="url(#softGlow)"/>

    <text y="-36"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="12">
      REACT
    </text>
  </g>


  <g transform="translate(980 177)">
    <circle r="28"
            fill="#07111f"
            stroke="#c084fc"
            stroke-width="1.5"/>

    <circle r="4"
            fill="#c084fc"
            filter="url(#softGlow)">

      <animate attributeName="opacity"
               values="1;.25;1"
               dur="2.4s"
               repeatCount="indefinite"/>

    </circle>

    <text y="47"
          text-anchor="middle"
          fill="#94a3b8"
          font-family="monospace"
          font-size="11">
      TYPESCRIPT
    </text>
  </g>



  <circle r="6"
          fill="#ffffff"
          filter="url(#softGlow)">

    <animateMotion
      path="M120 177
            C240 40 400 55 550 178
            C700 300 870 295 980 177
            C870 60 700 55 550 178
            C400 300 240 295 120 177"
      dur="7s"
      repeatCount="indefinite"/>

  </circle>



  <path d="M260 325
           L290 325
           L300 315
           L315 337
           L330 305
           L345 325
           L370 325
           L385 318
           L400 332
           L420 325
           L680 325
           L700 316
           L715 335
           L730 307
           L748 325
           L770 325
           L785 318
           L800 330
           L820 325
           L850 325"
        fill="none"
        stroke="url(#titleGradient)"
        stroke-width="2"
        stroke-linecap="round"
        opacity=".55">

    <animate attributeName="stroke-dasharray"
             values="1 1200;1200 1"
             dur="4s"
             repeatCount="indefinite"/>

  </path>



  <text x="550"
        y="348"
        text-anchor="middle"
        fill="#334155"
        font-family="monospace"
        font-size="10"
        letter-spacing="4">
    C# // .NET // ASP.NET // SQL // REACT // TYPESCRIPT
  </text>

</svg>

