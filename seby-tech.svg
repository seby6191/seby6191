          font-family="monospace"
          font-weight="700"
          font-size="20">
      .NET
    </text>

  </g>

  <!-- card 3 ASP -->

  <g transform="translate(440 142)">

    <rect x="-52"
          y="-48"
          width="104"
          height="96"
          rx="18"
          fill="#06111f"
          stroke="#60a5fa"
          stroke-opacity=".45"/>

    <text y="2"
          text-anchor="middle"
