
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="320"
     viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="tinyGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1198" height="318" rx="30" fill="url(#bg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="1198" height="318" rx="30" fill="url(#ambient)"/>

  <!-- subtle stars -->
  <g fill="#94a3b8" opacity="0.55">
    <circle cx="80" cy="50" r="1.2"/>
    <circle cx="160" cy="95" r="1"/>
    <circle cx="250" cy="58" r="1.3"/>
    <circle cx="360" cy="42" r="1"/>
    <circle cx="510" cy="70" r="1.1"/>
    <circle cx="690" cy="48" r="1.2"/>
    <circle cx="840" cy="72" r="1"/>
    <circle cx="980" cy="54" r="1.2"/>
    <circle cx="1095" cy="82" r="1"/>
    <circle cx="104" cy="262" r="1"/>
    <circle cx="220" cy="228" r="1.1"/>
    <circle cx="415" cy="270" r="1"/>
    <circle cx="565" cy="248" r="1.2"/>
    <circle cx="720" cy="280" r="1"/>
    <circle cx="935" cy="248" r="1.2"/>
    <circle cx="1105" cy="230" r="1"/>
  </g>

  <!-- floating particles -->
  <g opacity="0.35">
    <circle cx="140" cy="210" r="2" fill="#22d3ee" filter="url(#tinyGlow)">
      <animate attributeName="cy" values="210;198;210" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="250" r="2" fill="#a78bfa" filter="url(#tinyGlow)">
      <animate attributeName="cy" values="250;236;250" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="110" r="2" fill="#22d3ee" filter="url(#tinyGlow)">
      <animate attributeName="cy" values="110;98;110" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="186" r="2" fill="#c084fc" filter="url(#tinyGlow)">
      <animate attributeName="cy" values="186;173;186" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="600"
        y="52"
        text-anchor="middle"
        fill="#475569"
        font-family="monospace"
        font-size="12"
        letter-spacing="6">
    TECHNOLOGY CONSTELLATION
  </text>

  <text x="600"
        y="88"
        text-anchor="middle"
        fill="url(#title)"
        font-family="monospace"
        font-size="24"
        font-weight="700"
        letter-spacing="4"
        filter="url(#glow)">
    ENGINEERING STACK
  </text>

  <!-- curved beam path -->
  <path id="techPath"
        d="M110 210
           C190 110 280 110 360 175
           S525 255 610 170
           S785 85 865 160
           S1015 240 1090 145"
        fill="none"
        stroke="#132234"
        stroke-width="3.2"
        stroke-linecap="round"/>

  <path d="M110 210
           C190 110 280 110 360 175
           S525 255 610 170
           S785 85 865 160
           S1015 240 1090 145"
        fill="none"
        stroke="url(#beam)"
        stroke-width="2.4"
        stroke-linecap="round"
        opacity="0.35"
        stroke-dasharray="8 14">
    <animate attributeName="stroke-dashoffset" values="0;-110" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- moving energy -->
  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#techPath"/>
    </animateMotion>
  </circle>

  <circle r="18" fill="url(#beam)" opacity="0.18" filter="url(#softGlow)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#techPath"/>
    </animateMotion>
  </circle>

  <!-- helper for node style: circles only, no boring cards -->

  <!-- Node 1 -->
  <g transform="translate(120 210)">
    <circle r="34" fill="#07111f" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.8"/>
    <circle r="20" fill="#22d3ee" opacity="0.08" filter="url(#softGlow)">
      <animate attributeName="r" values="16;23;16" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.14;0.04" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="20" font-weight="700">C#</text>
    <text y="57" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">backend core</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(300 130)">
    <circle r="30" fill="#07111f" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.8"/>
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="17" font-weight="700">.NET</text>
    <text y="-44" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">runtime</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(480 215)">
    <circle r="31" fill="#07111f" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.8"/>
    <circle r="18" fill="#60a5fa" opacity="0.07" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <text y="1" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="700">ASP.NET</text>
    <text y="18" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">core</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(610 170)">
    <circle r="38" fill="#07111f" stroke="#818cf8" stroke-opacity="0.65" stroke-width="2"/>
    <circle r="24" fill="#818cf8" opacity="0.08" filter="url(#softGlow)">
      <animate attributeName="r" values="18;28;18" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <text y="7" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700">SQL</text>
    <circle r="52" fill="none" stroke="#818cf8" stroke-opacity="0.18" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node 5 -->
  <g transform="translate(770 112)">
    <circle r="30" fill="#07111f" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.8"/>
    <circle r="4" fill="#a78bfa" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="15" font-weight="700">REACT</text>
    <text y="-43" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">ui</text>
  </g>

  <!-- Node 6 -->
  <g transform="translate(930 190)">
    <circle r="32" fill="#07111f" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.8"/>
    <circle r="19" fill="#c084fc" opacity="0.08" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.04;0.14;0.04" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="16" font-weight="700">TS</text>
    <text y="55" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">typed web</text>
  </g>

  <!-- connector highlights -->
  <g stroke="#1e293b" stroke-width="1.2">
    <line x1="145" y1="196" x2="275" y2="143"/>
    <line x1="327" y1="146" x2="452" y2="201"/>
    <line x1="511" y1="205" x2="574" y2="181"/>
    <line x1="644" y1="156" x2="742" y2="124"/>
    <line x1="797" y1="124" x2="900" y2="179"/>
  </g>

  <g stroke="url(#beam)" stroke-opacity="0.18" stroke-width="1">
    <line x1="145" y1="196" x2="275" y2="143"/>
    <line x1="327" y1="146" x2="452" y2="201"/>
    <line x1="511" y1="205" x2="574" y2="181"/>
    <line x1="644" y1="156" x2="742" y2="124"/>
    <line x1="797" y1="124" x2="900" y2="179"/>
  </g>

  <!-- bottom statement -->
  <text x="600"
        y="286"
        text-anchor="middle"
        fill="#334155"
        font-family="monospace"
        font-size="11"
        letter-spacing="4">
    BACKEND • WEB • DATA • SYSTEM DESIGN THINKING
  </text>

</svg>

