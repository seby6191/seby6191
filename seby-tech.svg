          stroke="#e879f9"
          stroke-opacity=".45"/>

    <text y="1"
          text-anchor="middle"
          fill="#e2e8f0"
          font-family="monospace"
          font-weight="700"
          font-size="13">
      SYSTEMS
    </text>

    <text y="23"
          text-anchor="middle"
