      DEV
    </text>

  </g>

  <!-- moving energy -->

  <circle r="7"
          fill="#ffffff"
          filter="url(#glow)">

    <animateMotion
      path="M90 142 L1110 142"
      dur="4.8s"
      repeatCount="indefinite"/>

  </circle>

  <circle r="18"
          fill="url(#energy)"
          opacity=".18"
          filter="url(#softGlow)">

    <animateMotion
      path="M90 142 L1110 142"
      dur="4.8s"
      repeatCount="indefinite"/>

  </circle>

  <!-- bottom label -->

  <text x="600"
        y="222"
        text-anchor="middle"
        fill="#334155"
        font-family="monospace"
        font-size="10"
        letter-spacing="4">
    BACKEND // DATA // WEB // SYSTEMS
  </text>

</svg>
