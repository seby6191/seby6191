```svg
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="250"
     viewBox="0 0 1200 250">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="energy" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-120%"
            y="-120%"
            width="340%"
            height="340%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

  </defs>

  <!-- background -->

  <rect x="1"
        y="1"
        width="1198"
        height="248"
        rx="28"
        fill="url(#bg)"
        stroke="#1e293b"/>

  <!-- title -->

  <text x="60"
        y="52"
        fill="#475569"
        font-family="monospace"
        font-size="12"
        letter-spacing="5">
    TECHNOLOGY MATRIX
  </text>

  <circle cx="1100"
          cy="46"
          r="5"
          fill="#22d3ee"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".25;1;.25"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

  <text x="1120"
        y="51"
        fill="#64748b"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    ACTIVE
  </text>

  <!-- connection line -->

  <line x1="90"
        y1="142"
        x2="1110"
        y2="142"
        stroke="#172033"
        stroke-width="2"/>

  <!-- card 1 C# -->

  <g transform="translate(130 142)">

    <rect x="-52"
          y="-48"
          width="104"
          height="96"
          rx="18"
          fill="#06111f"
          stroke="#22d3ee"
          stroke-opacity=".45"/>

    <circle r="26"
            fill="#22d3ee"
            opacity=".06"
            filter="url(#softGlow)">

      <animate attributeName="opacity"
               values=".04;.16;.04"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

    <text y="8"
          text-anchor="middle"
          fill="#e2e8f0"
          font-family="monospace"
          font-weight="700"
          font-size="26">
      C#
    </text>

  </g>

  <!-- card 2 .NET -->

  <g transform="translate(285 142)">

    <rect x="-52"
