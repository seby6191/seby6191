          font-weight="700"
          font-size="22">
      SQL
    </text>

  </g>

  <!-- card 5 React -->

  <g transform="translate(750 142)">

    <rect x="-52"
          y="-48"
          width="104"
          height="96"
          rx="18"
          fill="#06111f"
          stroke="#a78bfa"
          stroke-opacity=".45"/>

    <text y="7"
          text-anchor="middle"
          fill="#e2e8f0"
          font-family="monospace"
          font-weight="700"
          font-size="18">
      REACT
    </text>

  </g>

  <!-- card 6 TS -->

  <g transform="translate(905 142)">

    <rect x="-52"
          y="-48"
          width="104"
          height="96"
          rx="18"
          fill="#06111f"
          stroke="#c084fc"
          stroke-opacity=".45"/>

    <text y="7"
          text-anchor="middle"
          fill="#e2e8f0"
          font-family="monospace"
          font-weight="700"
